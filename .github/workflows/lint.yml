name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Upgrade pip first to keep dependency resolution stable.
          python -m pip install --upgrade pip
          # Install the project with lint dependencies.
          python -m pip install -e ".[lint]"

      - name: Run ruff
        run: |
          # Check source and tests for lint violations.
          ruff check src tests
          # Ensure formatting matches the configured Ruff formatter rules.
          ruff format --check src tests

  types:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # Upgrade pip first to keep dependency resolution stable.
          python -m pip install --upgrade pip
          # Install the project with type-checking dependencies.
          python -m pip install -e ".[lint]"

      - name: Run mypy
        run: |
          # Type-check the package source tree.
          mypy src/iarena

  spell-checker:
    name: Test Python spelling
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[lint]"

    - name: Spell check (codespell)
      run: codespell --config .spelling/.codespellrc .
