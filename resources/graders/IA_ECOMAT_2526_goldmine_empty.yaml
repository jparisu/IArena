game: GoldMine

move_timeout_s: 5
total_timeout_s: 100
repetitions: 3
fails_allowed: 3
max_moves: 5000

trials:

  - name: Trivial Test

    description: "3x3 empty space starting top-left and finishing bottom-right."

    args:
      n: 3
      m: 3
      target_position:
        x: 2
        y: 2
      map_generator: "empty"

    value: 1



  - name: Inverse Test

    description: "3x3 empty space starting bottom-right and finishing top-left."

    args:
      n: 3
      m: 3
      starting_position:
        x: 2
        y: 2
      target_position:
        x: 0
        y: 0
      map_generator: "empty"

    value: 4



  - name: Random 5x5 Test

    description: "5x5 random positions."

    args:
      n: 5
      m: 5
      starting_position:
        x: -1
        y: -1
      map_generator: "empty"
    multi_args:
      seed: [1, 2, 3]

    value: 2



  - name: Unique row map

    description: "1 row map."

    args:
      n: 1
      map_generator: "empty"
    multi_args:
      m: [5, 10, 15]
    repetitions: 2

    value: 2



  - name: Random 25x25 Test

    description: "25x25 random positions."

    args:
      n: 25
      m: 25
      starting_position:
        x: -1
        y: -1
      map_generator: "empty"
    multi_args:
      seed: [11, 12, 13]
    repetitions: 2

    value: 5
