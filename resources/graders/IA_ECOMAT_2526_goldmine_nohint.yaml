game: GoldMine

move_timeout_s: 5
total_timeout_s: 100
repetitions: 3
max_moves: 10000

trials:

  - name: Trivial Test

    description: "3x3 empty space starting top-left and finishing bottom-right."

    args:
      n: 3
      m: 3
      target_position:
        x: 2
        y: 2
      map_generator: "empty"

    value: 1



  - name: Bimodal map ensuring connectivity

    description: "5x5 map with low and high costs ensuring connectivity, starting in (1,1)."

    args:
      n: 5
      m: 5
      starting_position:
        x: 1
        y: 1
      map_generator: "jumping"
      seed: [1, 2]

    value: 1



  - name: Bimodal map ensuring connectivity

    description: "10x10 map with low and high costs ensuring connectivity, starting in (1,1)."

    args:
      n: 10
      m: 10
      starting_position:
        x: 1
        y: 1
      map_generator: "jumping"
      seed: [1, 2]

    value: 2



  - name: Bimodal map ensuring connectivity

    description: "15x15 map with low and high costs ensuring connectivity, starting randomly."

    args:
      n: 15
      m: 15
      map_generator: "jumping"
      seed: [3, 4]
      map_generator_params:
        p_block: 0.5

    value: 3



  - name: Bimodal map not ensuring connectivity

    description: "15x15 bimodal map with no connectivity assured, starting top-left."

    args:
      n: 15
      m: 15
      starting_position:
        x: 1
        y: 1
      map_generator: "bimodal"
      seed: [6, 7, 8]
      map_generator_params:
        p_block: 0.7

    value: 4



  - name: Uniform map

    description: "15x15 uniformly distributed costs map."

    args:
      n: 15
      m: 15
      map_generator: "uniform"
      seed: [13, 14]

    value: 3



  - name: Pernil map

    description: "20x20 soft distributed map."

    args:
      n: 20
      m: 20
      map_generator: "perlin"
      seed: [33, 34]

    value: 3




  - name: Exponential map

    description: "25x25 exponentially distributed costs map."

    args:
      n: 25
      m: 25
      map_generator: "exponential"
      seed: [23, 24]

    value: 5
    max_moves: 20000
