exclude: |
  (^tests/)|
  (^.dev/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  # ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix]
        exclude: (^\.dev/)
      - id: ruff-format
        exclude: (^\.dev/)

  # mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        pass_filenames: false
        language: system
        # additional_dependencies:
        # - types-setuptools
        # - types-PyYAML
        args: ["--config-file=pyproject.toml", "src/iarena"]
        exclude: (^tests/)|(^\.dev/)|(^docs/)


  # codespell
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--config", ".spelling/.codespellrc"]

  # policy and docs checks
  - repo: local
    hooks:
      - id: pylint-size-and-complexity
        name: pylint size and complexity limits
        entry: pylint --recursive=y --disable=all --enable=line-too-long,too-many-lines,too-many-statements,too-complex --score=n src/iarena
        language: python
        additional_dependencies: ["pylint>=3.3.0"]
        pass_filenames: false
        exclude: (^tests/)|(^\.dev/)|(^docs/)
      - id: mkdocs
        name: mkdocs build (docs must compile)
        entry: mkdocs build --strict --quiet
        language: system
        pass_filenames: false

  # pylint
  - repo: https://github.com/pylint-dev/pylint
    rev: v3.1.0  # Use the latest version
    hooks:
    -   id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        # This tells pre-commit to check your specific source folder
        files: ^src/iarena/
