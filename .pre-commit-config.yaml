exclude: |
  (^tests/)|
  (^.dev/)

repos:

  # pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  # ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix]
        exclude: (^\.dev/)
      - id: ruff-format
        exclude: (^\.dev/)

  # mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        pass_filenames: false
        additional_dependencies:
        - numpy>=2.0.0
        - pandas>=2.0.0
        - scikit-learn>=1.0.0
        - matplotlib>=3.0.0
        - plotly>=5.0.0
        - scipy>=1.0.0
        - pandas-stubs>=2.0.0
        - scipy-stubs>=1.10.0
        - types-setuptools
        - types-PyYAML
        args: ["--config-file=pyproject.toml", "src/iarena"]
        exclude: (^tests/)|(^\.dev/)|(^docs/)


  # codespell
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ["--config", ".spelling/.codespellrc"]

  # mkdocs build check
  - repo: local
    hooks:
      - id: mkdocs
        name: mkdocs build (docs must compile)
        entry: mkdocs build --strict --quiet
        language: system
        pass_filenames: false
