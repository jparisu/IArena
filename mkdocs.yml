site_name: IArena
site_description: Documentation for IArena
site_author: jparisu
repo_url: https://github.com/jparisu/iarena
repo_name: iarena
edit_uri: edit/main/docs/

theme:
  name: readthedocs

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            show_source: true
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting Started: getting-started.md
  - Development: development.md
  - Changelog: changelog.md
  - API: api/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jparisu/iarena
