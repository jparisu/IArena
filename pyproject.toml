[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iarena"
version = "2.1.0"
description = "Python framework for building turn-based games and AI players"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    {name = "jparisu", email = "javier.paris.u@gmail.com"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["games", "game-framework", "ai-players", "turn-based", "tournaments", "iarena"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "noise>=1.2.2",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.14.0",
    "mypy>=1.0.0",
    "pylint>=3.3.0",
    "codespell>=2.0.0",
    "pre-commit>=3.8.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.24.0",
]
app = [
    "streamlit>=1.0.0",
    "seaborn>=0.12.0",
]
dev = [
    "ruff>=0.14.0",
    "mypy>=1.0.0",
    "pylint>=3.3.0",
    "codespell>=2.0.0",
    "pre-commit>=3.8.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/jparisu/iarena"
Documentation = "https://iarena.readthedocs.io/"
Repository = "https://github.com/jparisu/iarena"
Issues = "https://github.com/jparisu/iarena/issues"
Changelog = "https://github.com/jparisu/iarena/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["iarena*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test_*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]

[tool.coverage.run]
source = ["iarena"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
target-version = "py312"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["iarena"]

[tool.pylint.main]
py-version = "3.12"
load-plugins = ["pylint.extensions.mccabe"]

[tool.pylint.format]
max-line-length = 120
max-module-lines = 400

[tool.pylint.design]
max-statements = 50

[tool.pylint.mccabe]
max-complexity = 12

[tool.pylint.messages_control]
# Only enable errors and warnings
disable = [
    "C", # Disable all Convention messages (formatting, naming, etc.)
    "R", # Disable all Refactor messages (too many arguments, etc.)
    "W0201", # attribute-defined-outside-init
    "W0212", # protected-access
    "W0221", # arguments-differ
    "W0231", # super-init-not-called
    "W0404", # reimported
    "W0511", # fixme
    "W0622", # redefined-builtin
    "W0718", # broad-exception-caught
    "W2301", # unnecessary-ellipsis
    "E0601", # used-before-assignment
    "E1102", # not-callable
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = false
disable_error_code = [
    "arg-type",
    "attr-defined",
    "import-untyped",
    "override",
    "redundant-cast",
    "return-value",
    "unused-ignore",
]

[tool.codespell]
skip = '*.lock,.git,*.egg-info,build,dist'
