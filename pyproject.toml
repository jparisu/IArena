[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "iarena"
version = "3.0.0"
description = "IArena"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "jparisu", email = "javier.paris.u@gmail.com" },
]
keywords = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "PyYAML>=6.0",

]

[project.urls]
Homepage = "https://github.com/jparisu/iarena"
Repository = "https://github.com/jparisu/iarena"
Issues = "https://github.com/jparisu/iarena/issues"



[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "coverage[toml]>=7.8.0",
  "mkdocs>=1.6.0",
  "mkdocs-include-markdown-plugin>=7.0.0",
  "mkdocs-material>=9.6.0",
  "mkdocstrings[python]>=0.30.0",
  "mypy>=1.15.0",
  "pre-commit>=4.2.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.1.0",
  "ruff>=0.11.0",
  "twine>=6.1.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-include-markdown-plugin>=7.0.0",
  "mkdocs-material>=9.6.0",
  "mkdocstrings[python]>=0.30.0",
]
lint = [
  "mypy>=1.15.0",
  "ruff>=0.11.0",
]
test = [
  "pytest>=8.3.0",
  "pytest-cov>=6.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iarena", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = [
  "UP046",
  "UP047",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["iarena"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["iarena"]

[tool.coverage.report]
show_missing = true
skip_covered = false
